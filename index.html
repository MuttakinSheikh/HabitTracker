<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HabitTracker X</title><link rel="manifest" href="./manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07061a;--bg2:#0f0d2b;--card:rgba(30,24,70,.55);--bd:rgba(168,120,255,.25);--tx:#f1eeff;--mu:#9d95c9;--p:#8b5cf6;--pk:#ec4899;--or:#fb923c;--gd:#fbbf24;--ok:#22c55e;--er:#ef4444;--in:#16133a;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f1ff;--bg2:#fff;--card:rgba(255,255,255,.85);--bd:rgba(124,58,237,.22);--tx:#1d1640;--mu:#6b6394;--in:#fff;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:Sora,system-ui,sans-serif;background:radial-gradient(900px 500px at 80% -10%,rgba(139,92,246,.35),transparent),radial-gradient(700px 400px at 0 100%,rgba(236,72,153,.2),transparent),var(--bg);color:var(--tx);min-height:100vh}
h1,h2,h3{margin:0}button,input,select{font:inherit;color:var(--tx)}
input,select{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;margin:5px 0}
input[type=time]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:1;filter:invert(.6) sepia(1) saturate(5) hue-rotate(230deg)}
input:focus,button:focus-visible{outline:2px solid var(--pk);outline-offset:1px}
.btn{background:linear-gradient(90deg,var(--p),var(--pk));border:0;border-radius:10px;padding:10px 16px;color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.dg{background:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;backdrop-filter:blur(12px)}
.mu{color:var(--mu);font-size:.85rem}.err{color:var(--er);min-height:1.2em;font-size:.85rem}.okm{color:var(--ok)}
#auth{max-width:420px;margin:8vh auto;padding:16px}#auth .card{display:grid;gap:6px}
.logo{font-weight:800;font-size:1.6rem;background:linear-gradient(90deg,var(--p),var(--pk),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{padding:20px 14px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;cursor:pointer;color:var(--mu)}
nav button.on{background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(236,72,153,.2));color:var(--tx)}
main{padding:20px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--or));display:grid;place-items:center;font-weight:800;color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.big{font-size:1.9rem;font-weight:800}.bar{height:10px;background:var(--in);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pk),var(--or));transition:width .4s}
.hab{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;margin:5px 0;flex-wrap:wrap}.hab .btn{padding:4px 10px;font-size:.8rem}.hab.d{opacity:.6}.hab.d b{text-decoration:line-through}
.hab input[type=checkbox]{width:16px;height:16px;accent-color:var(--p);margin:0;flex:none}.hab>div{flex:1;min-width:0}
.chart{display:flex;gap:8px;align-items:flex-end;height:130px}.chart div{flex:1;text-align:center;font-size:.7rem}.chart i{display:block;background:linear-gradient(var(--pk),var(--p));border-radius:6px 6px 0 0;min-height:3px}
.bdg{text-align:center;padding:14px}.bdg.off{filter:grayscale(1);opacity:.45}.bdg span{font-size:2rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}.modal .card{background:var(--bg2);width:min(420px,100%)}
.hide{display:none!important}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:12px;z-index:20}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--bd)}nav .logo{display:none}nav button{white-space:nowrap}}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1);opacity:1}}#toast{animation:pop .35s}.flash{animation:fl .9s}@keyframes fl{0%{box-shadow:0 0 0 0 var(--gd)}100%{box-shadow:0 0 0 22px transparent}}
.cd{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.78rem;padding:2px 9px;border-radius:20px;background:var(--in);border:1px solid var(--bd)}.cd.live{color:var(--ok);border-color:var(--ok)}.cd.wait{color:var(--or);border-color:var(--or)}.cd.over{color:var(--er);border-color:var(--er)}.cdn{font-variant-numeric:tabular-nums}.cdn.live{color:var(--ok)}.cdn.wait{color:var(--or)}.cdn.over{color:var(--er)}
.cf{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#alb{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;background:var(--er);color:#fff;padding:10px 14px;border-radius:14px;display:flex;gap:12px;align-items:center;font-weight:600;box-shadow:0 0 30px var(--er);animation:shk .5s infinite}#alb .btn{background:#fff;color:#b91c1c}@keyframes shk{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-1.5deg)}75%{transform:translateX(-50%) rotate(1.5deg)}}
.dd{position:relative}.ddl{position:absolute;z-index:8;left:0;right:0;top:100%;max-height:260px;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.4)}.ddi{display:flex;align-items:center;border-radius:8px}.ddi:hover{background:var(--in)}.ddi .pk{flex:1;text-align:left;background:none;border:0;padding:9px 10px;cursor:pointer;color:var(--tx)}.ddi .pk.on{font-weight:800;color:var(--pk)}.ddi .dx{background:none;border:0;color:var(--er);font-size:1.2rem;padding:4px 14px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}#alb{animation:none}}
</style></head><body>

<section id="auth" class="hide"><div class="card">
<div class="logo">HabitTracker X</div><div class="mu">Build routines. Earn XP. Level up. · by MUTTAKIN</div>
<div id="fReg" class="hide"><input id="rn" placeholder="Full name" autocomplete="name"><input id="re" type="email" placeholder="Email" autocomplete="email"><input id="rp" type="password" placeholder="Password (min 8)" autocomplete="new-password"><input id="rc" type="password" placeholder="Confirm password" autocomplete="new-password"><button class="btn" id="bReg">Create account</button><button class="btn alt" data-sw="L">I already have an account</button></div>

<main><header><div><h2 id="hi"></h2><div class="mu" id="dt"></div></div><div class="row"><button class="btn alt" id="bSn" aria-label="Toggle sound">🔔</button><button class="btn alt" id="bTh">Light mode</button><div class="av" id="av"></div></div></header>
<div id="v"></div><footer class="mu" style="text-align:center;margin:28px 0 8px"><b class="logo" style="font-size:1.05rem">HabitTracker X</b><br>Made By MUTTAKIN</footer></main></div>

<div id="mod" class="modal hide"><div class="card" id="modB"></div></div><div id="toast" class="hide"></div><div id="alb" class="hide" role="alert"><span id="alt"></span><button class="btn" id="als">Stop alarm</button></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('en-CA')};
const REWARDS=[{id:'snack',n:'Favorite snack',c:40,i:'🍫'},{id:'game',n:'1 hour of gaming',c:60,i:'🎮'},{id:'movie',n:'Movie night',c:100,i:'🍿'},{id:'day',n:'Free day off',c:250,i:'🏖️'}];
let user,S,view='dash';
const enc=new TextEncoder(),b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const hash=async(p,salt)=>b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']),256));
const U=()=>{try{return JSON.parse(localStorage.getItem('htx_users')||'{}')}catch(x){return {}}},setU=u=>localStorage.setItem('htx_users',JSON.stringify(u));
const chk=async(e,p)=>{const a=U()[e];return !!a&&await hash(p,unb(a.salt))===a.hash};
const fresh=e=>({name:U()[e].name,username:e.split('@')[0],theme:'dark',xp:0,points:0,earned:0,tasks:[],log:{},redeemed:[]});
function start(e){user={email:e};let raw=localStorage.getItem('htx_d_'+e);try{S=raw?JSON.parse(raw):fresh(e)}catch(x){S=fresh(e)}
norm();localStorage.setItem('htx_s',e);setTheme(S.theme||'dark');
$('#auth').classList.add('hide');$('#app').classList.remove('hide');if(!raw)save();sweep();badgeCheck();render()}
function save(){try{localStorage.setItem('htx_d_'+user.email,JSON.stringify(S))}catch(x){toast('Save failed. Browser storage is full or blocked.')}}
function out(){localStorage.removeItem('htx_s');user=null;$('#app').classList.add('hide');$('#auth').classList.remove('hide');aerr('')}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),ms||2400)}
function setTheme(t){document.documentElement.dataset.theme=t;$('#bTh').textContent=t==='dark'?'Light mode':'Dark mode';if(S)document.documentElement.style.setProperty('--p',ACC[S.ac]||'#8b5cf6')}
$('#bTh').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';setTheme(S.theme);save()};
$('#bSn').onclick=()=>{S.sound=!S.sound;$('#bSn').textContent=S.sound?'🔔':'🔕';save();if(S.sound)alarm('🔔 Sound is on',1)};
const aerr=m=>$('#aMsg').textContent=m;
document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{aerr('');$('#fReg').classList.toggle('hide',b.dataset.sw!=='R');$('#fLog').classList.toggle('hide',b.dataset.sw==='R')});
$('#bReg').onclick=async()=>{const n=$('#rn').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value;
if(!n)return aerr('Enter your name.');if(!/^\S+@\S+\.\S+$/.test(e))return aerr('Enter a valid email.');if(p.length<8)return aerr('Password needs at least 8 characters.');if(p!==$('#rc').value)return aerr('Passwords do not match.');
if(!window.crypto||!crypto.subtle)return aerr('This browser blocks secure hashing. Open the site over https.');
const u=U();if(u[e])return aerr('An account with this email already exists here.');const salt=crypto.getRandomValues(new Uint8Array(16));u[e]={name:n,salt:b64(salt),hash:await hash(p,salt)};setU(u);start(e)};
$('#bLog').onclick=async()=>{const e=$('#le').value.trim().toLowerCase();try{if(!await chk(e,$('#lp').value))return aerr('Wrong email or password.');start(e)}catch(x){aerr('Could not log in on this browser.')}};
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav [data-v]').forEach(x=>x.classList.toggle('on',x===b));render()});

const catsAll=()=>[...new Set(CATS.filter(c=>!(S.hid||[]).includes(c)).concat(S.cats||[]))];
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],CATS=['Mathematics','Physics','English','Bangla','Basic Electricity','College Study','Python Programming','Coding Practice','Skill Development','Exercise','Personal Tasks'];
const BASE={easy:6,medium:12,hard:20},COSTS=[20,40,60,100,150,250],RC=['Entertainment','Food','Gift','Outing','Milestone'],LEARN=['Mathematics','Physics','Programming','Python Programming','New skills','Skill Development','Coding Practice'],AVS=['🦊','🐼','🚀','🎮','🧠','🐉'];
const DEF_RW=()=>[{id:'r1',n:'Favorite snack',d:'A treat you love',cat:'Food',c:40},{id:'r2',n:'30 minutes of entertainment',d:'Guilt-free break',cat:'Entertainment',c:60},{id:'r3',n:'Movie night',d:'Pick any movie',cat:'Entertainment',c:100}];
function norm(){S.tasks=Array.isArray(S.tasks)?S.tasks:[];S.log=S.log&&typeof S.log==='object'?S.log:{};S.rewards=Array.isArray(S.rewards)?S.rewards:DEF_RW();S.redeemed=Array.isArray(S.redeemed)?S.redeemed:[];S.badges=S.badges&&typeof S.badges==='object'?S.badges:{};
['xp','points','earned'].forEach(k=>S[k]=Math.max(0,+S[k]||0));S.checked=S.checked||today();S.made=S.made||today();S.name=S.name||'Player';S.username=S.username||'player';S.cats=Array.isArray(S.cats)?S.cats.filter(c=>typeof c==='string').slice(0,30):[];S.sound=S.sound!==false;S.hid=Array.isArray(S.hid)?S.hid:[];S.wins=+S.wins||0;S.chests=+S.chests||0;S.wg=[100,200,300,400,500].includes(S.wg)?S.wg:200}
const nx=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+1);return x.toLocaleDateString('en-CA')},dow=d=>new Date(d+'T12:00').getDay();
const G=d=>S.log[d]||{done:{},missed:{}},L=d=>(S.log[d]=S.log[d]||{done:{},missed:{}});
const mins=t=>{if(!t.start||!t.end)return 30;const a=t.start.split(':'),b=t.end.split(':'),m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return m>0?m:30};
const pts=t=>Math.min(30,BASE[t.diff]+Math.min(6,Math.floor(mins(t)/30)*2)+(t.pri==='high'?3:0)+(t.diff==='hard'&&LEARN.includes(t.cat)?3:0));
const sched=d=>S.tasks.filter(t=>t.days.includes(dow(d))&&t.created<=d),dayPts=d=>Object.values(G(d).done).reduce((a,x)=>a+x.p,0);
const need=l=>l<=3?250:250+(l-3)*50;
function lv(){let l=1,x=S.xp;while(x>=need(l)){x-=need(l);l++}return{l,x,n:need(l)}}
function active(d){const g=G(d);return Object.keys(g.done).length>0||g.rest}
function streak(){let n=0,o=active(today())?0:1;while(active(today(o+n))&&n<400)n++;return n}
const allDone=()=>Object.values(S.log).flatMap(l=>Object.values(l.done)),cnt=f=>allDone().filter(f).length;
const BADGES=[{id:'b1',i:'🗡️',n:'First Quest',t:'Complete your first task',ok:()=>cnt(()=>1)>=1},{id:'b2',i:'🔥',n:'3-Day Streak',t:'Stay active 3 days in a row',ok:()=>streak()>=3},{id:'b3',i:'⚔️',n:'7-Day Warrior',t:'7-day streak',ok:()=>streak()>=7},{id:'b4',i:'🛡️',n:'30-Day Consistency',t:'30-day streak',ok:()=>streak()>=30},
{id:'b5',i:'📐',n:'Mathematics Master',t:'Complete 20 Mathematics tasks',ok:()=>cnt(x=>x.cat==='Mathematics')>=20},{id:'b6',i:'💻',n:'Coding Explorer',t:'Complete 15 Programming or Coding tasks',ok:()=>cnt(x=>['Programming','Python Programming','Coding Practice'].includes(x.cat))>=15},{id:'b7',i:'🤖',n:'Skill Seeker',t:'Complete 10 New skills or Skill Development tasks',ok:()=>cnt(x=>x.cat==='New skills'||x.cat==='Skill Development')>=10},
{id:'b8',i:'👑',n:'Hard Mode Champion',t:'Complete 10 hard tasks',ok:()=>cnt(x=>x.diff==='hard')>=10},{id:'b9',i:'💎',n:'500 Points Earned',t:'Earn 500 points in total',ok:()=>S.earned>=500},{id:'b10',i:'🌟',n:'Level 10 Player',t:'Reach level 10',ok:()=>lv().l>=10},{id:'b12',i:'🎁',n:'Treasure Hunter',t:'Open 3 daily chests',ok:()=>S.chests>=3},{id:'b13',i:'🏆',n:'Weekly Champion',t:'Reach a weekly goal',ok:()=>S.wins>=1}];
function badgeCheck(){BADGES.forEach(b=>{if(!S.badges[b.id]&&b.ok()){S.badges[b.id]=today();toast('🏅 Badge unlocked: '+b.n,3500);confetti()}})}
function sweep(){const t0=today();let d=S.checked<today(30)?today(30):S.checked;for(;d<t0;d=nx(d)){const g=G(d);if(g.rest)continue;sched(d).forEach(t=>{if(g.done[t.id]||g.missed[t.id])return;const p=Math.min(Math.max(1,Math.round(BASE[t.diff]/4)),S.points);S.points-=p;L(d).missed[t.id]={p,n:t.name,cat:t.cat}})}S.checked=t0;save()}
function complete(id){const d=today(),t=S.tasks.find(x=>x.id===id),l=L(d);if(!t||l.done[id]||l.rest||!t.days.includes(dow(d)))return;
const p=Math.min(pts(t),Math.max(0,100-dayPts(d))),b=lv().l;l.done[id]={p,n:t.name,cat:t.cat,diff:t.diff,m:mins(t)};S.xp+=p;S.points+=p;S.earned+=p;
if(!p)toast('Daily cap of 100 points reached. Task logged without points.',3000);else toast('+'+p+' points');const q=qd(d);if(!l.q&&q.f(l)>=q.t){l.q=1;S.points+=q.b;S.xp+=q.b;S.earned+=q.b;toast('🎯 Daily quest done! +'+q.b+' bonus points',4000);confetti()}if(S.wclaim!==wk()&&weekPts()>=S.wg){S.wclaim=wk();S.wins++;const w2=S.wg/10;S.points+=w2;S.xp+=w2;S.earned+=w2;toast('🏆 Weekly goal reached! +'+w2,4000);confetti()}badgeCheck();if(lv().l>b){toast('🎉 Level up! Level '+lv().l+' · '+title(lv().l),4000);confetti()}save();render()}
function restDay(){const d=today(),g=L(d);if(g.rest){g.rest=false;save();return render()}let n=0;for(let o=1;o<7;o++)if(G(today(o)).rest)n++;if(n>=1)return toast('You can take one rest day per week.');g.rest=true;save();render();toast('Rest day on. No penalties today.')}
function taskRow(t,d,btns){const g=G(d),dn=g.done[t.id],mis=g.missed[t.id],cdx=d===today()&&!dn&&!g.rest?((t.start||t.end)?`<span class="cd" data-cid="${t.id}"></span>`:'')+`<button class="btn alt" data-f="${t.id}">Focus</button>`:'';return `<div class="hab ${dn?'d':''}"><input type="checkbox" aria-label="Complete ${esc(t.name)}" data-t="${t.id}" ${dn?'checked':''} ${dn||g.rest||d!==today()?'disabled':''}><div><b>${esc(t.name)}</b><div class="mu">${esc(t.cat)} · ${t.start||'Anytime'}${t.end?'–'+t.end:''} · ${t.diff} · ${t.pri==='high'?'high priority · ':''}+${pts(t)} pts${mis?' · missed':''}</div></div>${cdx}${btns||''}</div>`}
const hms=s=>{s=Math.max(0,Math.floor(s));return[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')},tm2=hm=>{const a=hm.split(':'),x=new Date();x.setHours(+a[0],+a[1],0,0);return x};
function cdText(t){const n=new Date();if(t.start&&n<tm2(t.start))return['Starts in '+hms((tm2(t.start)-n)/1e3),'wait'];if(t.end&&n<tm2(t.end))return['Ends in '+hms((tm2(t.end)-n)/1e3),'live'];if(t.end)return['Time over','over'];if(t.start)return['Started','live'];return['','']}

<script>

let busy=false,sOpen=false;
const chat=()=>{S.ai=S.ai&&Array.isArray(S.ai.chat)?S.ai:{chat:[]};S.ai.chat=S.ai.chat.filter(m=>m&&(m.r==='user'||m.r==='assistant')&&typeof m.c==='string').slice(-30);return S.ai.chat};
const md=t=>esc(t).replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\w*\n/,'')+'</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
/* offline calculator: safe recursive-descent parser, no eval */
function calc(src){const t=src.toLowerCase().replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,''),T=t.match(/\d*\.?\d+(e[+-]?\d+)?|[a-z]+|[-+*/^()!,]/g)||[];if(T.join('')!==t)throw 0;let i=0;
const F={sqrt:Math.sqrt,cbrt:Math.cbrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,round:Math.round,deg:x=>x*180/Math.PI,rad:x=>x*Math.PI/180},K={pi:Math.PI,e:Math.E};
const pk=()=>T[i],nx=()=>T[i++];
const ex=()=>{let v=tm();while(pk()==='+'||pk()==='-')v=nx()==='+'?v+tm():v-tm();return v};
const tm=()=>{let v=un();while(pk()==='*'||pk()==='/'||(pk()&&/^[a-z(\d.]/.test(pk())&&pk()!==')')){if(pk()==='*'){nx();v*=un()}else if(pk()==='/'){nx();v/=un()}else v*=un()}return v};
const un=()=>pk()==='-'?(nx(),-un()):pk()==='+'?(nx(),un()):pw();
const pw=()=>{let b=po();if(pk()==='^'){nx();return Math.pow(b,un())}return b};
const po=()=>{let v=pr();while(pk()==='!'){nx();if(v<0||v>170||v%1)throw 0;let f=1;for(let k=2;k<=v;k++)f*=k;v=f}return v};
const pr=()=>{const x=nx();if(x===undefined)throw 0;if(x==='('){const v=ex();if(nx()!==')')throw 0;return v}if(/^[\d.]/.test(x))return +x;if(K[x]!==undefined)return K[x];if(F[x]){if(nx()!=='(')throw 0;const v=ex();if(nx()!==')')throw 0;return F[x](v)}throw 0};
const r=ex();if(i!==T.length||!Number.isFinite(r))throw 0;return r}
const fmt=n=>String(+n.toPrecision(12));
function quad(a,b,c){if(![a,b,c].every(Number.isFinite))return 'Enter numbers for a, b and c.';if(a===0)return b===0?'Not an equation: a and b are both 0.':'a = 0, so it is linear: x = -c/b = '+fmt(-c/b);
const D=b*b-4*a*c,L=['Equation: '+a+'x² + '+b+'x + '+c+' = 0','Discriminant D = b² - 4ac = '+fmt(D)];
if(D>0){L.push('D > 0: two real roots','x = (-b ± √D) / 2a','x1 = '+fmt((-b+Math.sqrt(D))/(2*a)),'x2 = '+fmt((-b-Math.sqrt(D))/(2*a)))}else if(D===0)L.push('D = 0: one repeated root','x = -b / 2a = '+fmt(-b/(2*a)));else L.push('D < 0: no real roots','Complex roots: '+fmt(-b/(2*a))+' ± '+fmt(Math.sqrt(-D)/(2*Math.abs(a)))+'i');return L.join('\n')}
const FORM=[['Kinematics','v = u + at\ns = ut + ½at²\nv² = u² + 2as'],['Newton and energy','F = ma\nWeight W = mg (g ≈ 9.8 m/s²)\nKE = ½mv²   PE = mgh\nWork = F × d   Power = W / t'],['Electricity','V = IR\nP = VI\nSeries R = R1 + R2\nParallel 1/R = 1/R1 + 1/R2'],['Waves and light','v = fλ\nf = 1/T\nn = c / v'],['Algebra','(a+b)² = a² + 2ab + b²\n(a+b)(a-b) = a² - b²\nQuadratic: x = (-b ± √(b²-4ac)) / 2a'],['Geometry','Circle: A = πr², C = 2πr\nTriangle: A = ½bh\nPythagoras: a² + b² = c²\nSphere: V = 4/3 πr³'],['Trigonometry','sin² + cos² = 1\nsin = opp/hyp, cos = adj/hyp, tan = opp/adj'],['Calculus','d/dx xⁿ = n·xⁿ⁻¹\n∫ xⁿ dx = xⁿ⁺¹/(n+1) + C\nProduct rule: (uv)\' = u\'v + uv\'']];
async function send(text){const c=cfg(),m=chat();if(busy||!text.trim())return;
if(!c.key){toast('Add an API key in AI settings, or use the offline tools below.',3500);return}
const base=(c.base||'https://api.openai.com/v1').replace(/\/+$/,'');if(c.prov==='custom'&&!/^https:\/\/|^http:\/\/localhost/.test(base)){toast('Custom URL must start with https:// (or http://localhost).',3500);return}
m.push({r:'user',c:text.trim().slice(0,4000)});busy=true;tRender(true);const hist=m.slice(-14).map(x=>({role:x.r,content:x.c})),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000),model=c.model||DEF[c.prov]||'';
try{let res,out;
if(c.prov==='anthropic'){res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1200,system:SYS,messages:hist})})}
else{res=await fetch(base+'/chat/completions',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model,max_tokens:1200,messages:[{role:'system',content:SYS},...hist]})})}
const j=await res.json().catch(()=>({}));
if(!res.ok){const e=(j.error&&(j.error.message||j.error))||'';throw new Error(res.status===401?'The API key was rejected. Check it in AI settings.':res.status===429?'Rate limit or quota reached. Wait a moment or check your provider plan.':'The provider returned an error ('+res.status+'). '+String(e).slice(0,160))}
out=c.prov==='anthropic'?(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n'):(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content);
if(!out)throw new Error('The provider sent an empty reply.');
chat().push({r:'assistant',c:String(out).slice(0,8000)})}
catch(e){chat().pop();toast(e.name==='AbortError'?'The request timed out.':e.message&&!/Failed to fetch|Load failed|NetworkError/i.test(e.message)?e.message:(navigator.onLine?'Could not reach the provider. Check the URL, or the provider may block browser requests (CORS).':'You are offline. Use the offline tools below.'),5000);tText=text}
clearTimeout(to);busy=false;save();tRender()}
let tText='';
function tRender(wait){const v=$('#v'),c=cfg(),m=chat(),has=!!c.key;
v.innerHTML=`<div id="tc" style="display:grid;gap:14px"><div class="card"><div class="row" style="justify-content:space-between"><h3>🤖 AI Tutor</h3><span class="mu">${has?'Connected: '+({openai:'OpenAI',anthropic:'Anthropic',custom:'Custom'}[c.prov])+' · '+esc(c.model||DEF[c.prov]||'set a model'):'No API key yet. Offline tools below still work.'}</span></div>
<div class="tlog" id="tlog">${m.map(x=>`<div class="tmsg ${x.r==='user'?'u':'a'}">${md(x.c)}</div>`).join('')||'<p class="mu">Ask about math, physics, chemistry, coding or study plans. Try: Explain how to solve 2x² - 5x + 3 = 0.</p>'}${wait?'<div class="tmsg a mu">Thinking…</div>':''}</div>
<div class="row" style="margin:8px 0">${['Math','Physics','Chemistry','Coding','Study plan'].map(x=>`<button class="btn alt" data-tp="${x}">${x}</button>`).join('')}</div>
<textarea id="tin" rows="3" maxlength="4000" placeholder="Type your question…" style="width:100%;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);font:inherit">${esc(tText)}</textarea>
<div class="row" style="margin-top:8px"><button class="btn" id="tsend" ${busy?'disabled':''}>Send</button><button class="btn alt" id="tclr">Clear chat</button></div></div>
<details class="card" id="tset" ${has&&!sOpen?'':'open'}><summary><b>AI settings</b></summary><p class="mu">Use your own API key. It is saved only in this browser (not in backups) and sent only to the provider you choose. Anyone using this browser profile could read it, and you pay your provider for usage. For a public website, route requests through your own server instead.</p>
<label class="mu">Provider<select id="tpv"><option value="openai" ${c.prov==='openai'?'selected':''}>OpenAI</option><option value="anthropic" ${c.prov==='anthropic'?'selected':''}>Anthropic (Claude)</option><option value="custom" ${c.prov==='custom'?'selected':''}>Custom (OpenAI-compatible)</option></select></label>
<label class="mu">API key<input id="tky" type="password" autocomplete="off" placeholder="${has?'Key saved. Type to replace.':'Paste your API key'}"></label>
<label class="mu">Model (optional)<input id="tmd" value="${esc(c.model)}" placeholder="${esc(DEF[c.prov]||'model name')}"></label>
<label class="mu" id="tbw" ${c.prov==='custom'?'':'class="hide" style="display:none"'}>Base URL<input id="tbu" value="${esc(c.base)}" placeholder="https://your-provider.com/v1"></label>
<div class="row" style="margin-top:8px"><button class="btn" id="tsv">Save settings</button><button class="btn alt" id="trm">Remove key</button></div></details>
<div class="card"><h3>Offline math tools</h3><p class="mu">These run on your device with no key and no internet.</p>
<div class="row"><input id="tcx" placeholder="Calculator, e.g. 3*(4+5)^2/7 or sqrt(2)*sin(pi/6)" style="flex:1;min-width:200px"><button class="btn" id="tcg">Calculate</button></div><div class="big" id="tcr" style="font-size:1.2rem"></div>
<div class="row" style="margin-top:10px"><input id="qa" type="number" step="any" placeholder="a" style="width:90px"><input id="qb" type="number" step="any" placeholder="b" style="width:90px"><input id="qc" type="number" step="any" placeholder="c" style="width:90px"><button class="btn" id="tq">Solve ax² + bx + c = 0</button></div><pre class="tpre" id="tqr"></pre></div>
<details class="card"><summary><b>Formula sheet</b></summary>${FORM.map(f=>`<h3 style="margin:10px 0 4px;font-size:1rem">${f[0]}</h3><pre class="tpre">${esc(f[1])}</pre>`).join('')}</details></div>`;
const lg=$('#tlog');lg.scrollTop=lg.scrollHeight;
$('#tsend').onclick=()=>{const t=$('#tin').value;tText='';send(t)};$('#tin').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('#tsend').click()};
v.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{$('#tin').value='['+b.dataset.tp+'] ';$('#tin').focus()});
$('#tclr').onclick=()=>{S.ai.chat=[];save();tRender()};
$('#tset').ontoggle=()=>{sOpen=$('#tset').open};
$('#tpv').onchange=()=>{sOpen=true;const x=cfg();x.prov=$('#tpv').value;putCfg(x);tText=$('#tin').value;tRender()};
$('#tsv').onclick=()=>{const x=cfg();x.prov=$('#tpv').value;const k=$('#tky').value.trim();if(k)x.key=k;x.model=$('#tmd').value.trim().slice(0,80);x.base=$('#tbu')?$('#tbu').value.trim().slice(0,200):x.base;if(putCfg(x)){sOpen=false;toast('AI settings saved');tRender()}};
$('#trm').onclick=()=>{try{localStorage.removeItem(CK())}catch(e){}toast('API key removed');tRender()};
$('#tcg').onclick=()=>{try{$('#tcr').textContent='= '+fmt(calc($('#tcx').value))}catch(e){$('#tcr').textContent='Could not read that expression. Use numbers, + - * / ^, brackets and functions like sqrt().'}};
$('#tcx').onkeydown=e=>{if(e.key==='Enter')$('#tcg').click()};
$('#tq').onclick=()=>{$('#tqr').textContent=quad(parseFloat($('#qa').value),parseFloat($('#qb').value),parseFloat($('#qc').value))}}
const prev=render;render=function(){if(view==='tutor'){tRender();return}prev()};
window.__calc=calc;
})();
</script>
</body></html>
